# vault-keystone — THE CROWN JEWEL. DATA-tier LXC (Keystone). Proxmox CT config
# for VMID 953. Canonical /etc/pve/lxc/953.conf. Matches
# modules/vault-keystone/manifest.yaml:
#   technique_class crown-store · port 8200 · flag KEYSTONE{CROWN-master-signing-key-<rot>}
# Brain: willshomelab (192.168.0.240). Sits on the DATA side on its own isolated
# bridge vmbr51 (VLAN 51, 10.50.1.0/24) — separated from CORP at L2 and L3 by the
# 2026-10-15 redesign, not just an ACL. The hEX lets ONLY CORP hosts reach :8200
# (build/hex-firewall.nft). No uplink, so neither the house LAN, Parrot, nor the
# Pi can reach it directly — the crown is physically, not just logically, segregated.
arch: amd64
cores: 1
memory: 256
swap: 256
hostname: vault-keystone
ostype: debian
unprivileged: 1
features: nesting=0
onboot: 0
# No gw= : the crown has no route off-segment and cannot phone home.
net0: name=eth0,bridge=vmbr51,firewall=1,ip=10.50.1.14/24,type=veth
# Operator fills the real storage volume at provisioning time (see BRINGUP.md).
rootfs: local-lvm:vm-953-disk-0,size=2G
