# ks-intranet01 — CORP ssrf-pivot internal-panel LXC (Keystone). Proxmox CT
# config for VMID 952. Canonical /etc/pve/lxc/952.conf. Matches
# modules/ks-intranet01/manifest.yaml:
#   technique_class ssrf-pivot · port 8092 · flag KEYSTONE{intranet01-admin-<rot>}
# Brain: willshomelab (192.168.0.240). Bridge vmbr50 is isolated (no uplink).
arch: amd64
cores: 1
memory: 256
swap: 256
hostname: ks-intranet01
ostype: debian
unprivileged: 1
features: nesting=0
onboot: 0
# No gw= : vmbr50 has no gateway/uplink, so the guest has no route off-segment.
net0: name=eth0,bridge=vmbr50,firewall=1,ip=10.50.0.13/24,type=veth
# Operator fills the real storage volume at provisioning time (see BRINGUP.md).
rootfs: local-lvm:vm-952-disk-0,size=2G
