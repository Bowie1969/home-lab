[global]
   workgroup = KEYSTONE
   server string = IT File Server
   security = user
   map to guest = Bad User
   guest account = nobody
   log level = 1

# VULN (by design): world-readable guest share with sensitive handover doc.
[public]
   path = /srv/share
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
