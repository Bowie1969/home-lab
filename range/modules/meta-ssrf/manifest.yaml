id: meta-ssrf
description: >-
  A URL-fetch/webhook feature follows attacker-supplied URLs, enabling SSRF to
  internal-only services (and a cloud-style metadata endpoint) to pivot inward.
technique_class: ssrf-pivot
substrate: container
network_zone: dmz
hostname: meta-ssrf
ports:
  - 8086
prereqs: []
enables:
  - cache-open
  - runner-escape
  - ks-ws01
build:
  containerfile: Containerfile
  context: .
flag:
  value: "KEYSTONE{ssrf-pivot-<rot>}"
  placement: /app/flag.txt
  rotate_per_run: true
scoring_hint: Pivot/Relay
evidence:
  ip: "10.99.50.116 (real, macvlan on dmz-web-b VM 971, brain vmbr9 VLAN 9)"
  host: brain dmz-web-b (VM 971)
  success: >-
    SSRF reaches an internal service not otherwise exposed; internal response
    content returned to the attacker through the vulnerable fetcher.
  signals:
    - journal: foothold event technique=ssrf-pivot host=meta-ssrf
    - pcap: request originating from meta-ssrf toward an internal-only port
