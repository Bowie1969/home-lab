id: token-jwt
description: >-
  API authenticates with JWTs but accepts the "none" algorithm and a weak HMAC
  secret, allowing token forgery and auth bypass to an admin role.
technique_class: jwt-authbypass
substrate: container
network_zone: dmz
hostname: token-jwt
ports:
  - 8085
prereqs: []
enables:
  - runner-escape
  - ks-ws01
build:
  containerfile: Containerfile
  context: .
flag:
  value: "KEYSTONE{jwt-bypass-<rot>}"
  placement: /app/flag.txt
  rotate_per_run: true
scoring_hint: Initial Access
evidence:
  ip: "10.99.50.117 (real, macvlan on dmz-web-b VM 971, brain vmbr9 VLAN 9)"
  host: brain dmz-web-b (VM 971)
  success: forged/altered JWT accepted as an admin, unlocking a privileged route.
  signals:
    - journal: foothold event technique=jwt-authbypass host=token-jwt
